# ============================================================
#  WT Scanner - tüm parametreler burada
# ============================================================

db_dir: state/db         # SQLite: us.db, crypto.db, bist.db
output_dir: state/output # CSV ve TradingView watchlist dosyaları
data_dir: state/data     # web uygulamasının okuduğu JSON dosyaları
export:
  compact_bars: 150      # uygulamadaki kırılım hesabı için sembol başına bar
  chart_bars: 400        # grafik için sembol başına bar

# NOT: WaveTrend parametreleri wt_params.json dosyasından okunur (uygulama bu dosyayı günceller).
#      Aşağıdaki değerler sadece wt_params.json yoksa kullanılır.

# ---------- WaveTrend (LazyBear) ----------
wavetrend:
  n1: 10                # channel length
  n2: 21                # average length
  signal: 4             # WT2 = SMA(WT1, signal)
  os_level1: -45        # OS1: -45 ile -53 arası
  os_level2: -53        # OS2: -53 altı
  ob_level1: 45         # OB1: 45 ile 53 arası
  ob_level2: 53         # OB2: 53 üstü
  keep_after_exit: 10   # bölgeden çıktıktan sonra kaç bar daha listede kalsın

# ---------- Kırılım (Aşama 2) ----------
breakout:
  supertrend_atr: 10
  supertrend_mult: 3.0
  ema_fast: 5
  ema_slow: 12
  rsi_len: 14
  lookback: 2           # Supertrend/EMA kesişimi son kaç bar içinde olmuş olmalı
  rsi_lookback: 3       # RSI teyidi son kaç bar içinde
  wt_cross: true        # WT1/WT2 bölge içi kesişimi tetikleyici olsun mu
  wt_cross_lookback: 3  # WT kesişimi son kaç bar içinde
  rsi_mode: cross       # cross = 50/30/70 kesişimi | level = RSI 50'nin doğru tarafında
  overbought_bullish_continuation: false   # true: OB listesinde yükseliş devam sinyali de ara
  oversold_bearish_continuation: false     # true: OS listesinde düşüş devam sinyali de ara

# ---------- Piyasalar ----------
markets:
  us:
    enabled: true
    history: 3y
    min_price: 5
    min_avg_volume: 500000     # 20 günlük ortalama hacim
    exchanges: [NASDAQ, NYSE, AMEX]
    close_time: "16:00"
    timezone: America/New_York
    chunk_size: 200            # yfinance toplu indirme parça boyutu
  crypto:
    enabled: true
    top_n: 200
    # Sırayla denenir. Binance ABD IP'lerini engeller (HTTP 451);
    # ABD'den çalıştırıyorsan kraken/coinbase devreye girer.
    exchanges:
      - {id: binance, quote: USDT, tv_prefix: BINANCE}
      - {id: kraken,  quote: USD,  tv_prefix: KRAKEN}
      - {id: coinbase, quote: USD, tv_prefix: COINBASE}
    exclude_bases: [USDT, USDC, BUSD, DAI, TUSD, FDUSD, USDP, USDE, PYUSD, EUR, EURC, GBP, TRY, WBTC, WETH, STETH]
  bist:
    enabled: true
    history: 3y
    min_avg_volume: 0
    symbols_file: bist_symbols.txt
    close_time: "18:10"
    timezone: Europe/Istanbul
    chunk_size: 100

# ---------- Telegram (opsiyonel) ----------
telegram:
  enabled: false
  token: ""
  chat_id: ""
